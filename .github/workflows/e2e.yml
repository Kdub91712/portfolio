name: E2E Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  e2e:
    # Pin to 24.04: @playwright/test 1.59.1 in yarn.lock only ships browser
    # builds up to ubuntu24.04. Once Playwright is >= 1.61, ubuntu-latest
    # (26.04) works and this can go back.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          REACT_APP_ADMIN_PASSWORD: ${{ secrets.REACT_APP_ADMIN_PASSWORD }}
          REACT_APP_FORM_URL: ${{ secrets.REACT_APP_FORM_URL }}
          REACT_APP_PROJECT_DETAILS_URL: ${{ secrets.REACT_APP_PROJECT_DETAILS_URL }}
          REACT_APP_PROJECT_TECHNOLOGIES_URL: ${{ secrets.REACT_APP_PROJECT_TECHNOLOGIES_URL }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
